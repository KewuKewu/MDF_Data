<!DOCTYPE html>
<html lang="zh-cn">
<head>
	<meta charset="UTF-8">
	<title>卡牌管理前端示例</title>
	<style>
		body {
			background: linear-gradient(120deg, #222 0%, #444 100%);
			color: #eee;
			font-family: 'Segoe UI', 'Microsoft YaHei', Arial, sans-serif;
			margin: 0;
			padding: 0;
		}
		h2 {
			text-align: center;
			font-size: 2rem;
			margin-bottom: 24px;
			color: #fff;
			letter-spacing: 2px;
			text-shadow: 0 2px 8px #000;
		}
		.main-section {
			display: flex;
			gap: 24px;
			max-width: 1400px;
			margin: 0 auto;
		}

		.deck-section-full {
			position: relative;
			/* flex: 10; */
			width: 95%;
			margin: 40px auto;
			padding: 30px 0;
			background: rgba(30,30,30,0.85);
			border-radius: 18px;
			box-shadow: 0 8px 32px rgba(0,0,0,0.5);

			display: none;
			flex-direction: column;

			height: 85vh;
			/* max-height: 85vh; */
			overflow-y: auto;
		}
		.deck-section-full-card-list {
			display: flex;
			padding: 5px 2.5%;
			gap: 1%;
			flex-direction: row;
			flex-wrap: wrap;
		}
		.deck-section-full-card{
			position: relative;

			flex: none;
			min-width: 150px;
			width: calc((100% - 5%) / 6); /* 6张卡牌，5个gap */
			height: auto;
			/* max-width: 18%; */
			margin: 10px 0;
			padding: 0;
			background: rgba(40,40,40,0.85);
			border-radius: 12px;
			box-shadow: 0 4px 16px rgba(0,0,0,0.5);
			display: flex;
			flex-direction: column;
			align-items: center;
		}
		.deck-section-full-card img {
			width: 100%;
			height: 100%;
			border-radius: 12px;
			box-shadow: 0 4px 16px #111;
			filter: grayscale(30%);
			transition: transform 0.3s, filter 0.3s;
			cursor: pointer;
			object-fit: cover;
			display: block;
		}
		.card-count-overlay {
			position: absolute;
			top: 8px;
			left: 12px;
			background: rgba(0,0,0,0.6);
			color: #fff;
			font-size: 1.4rem;
			font-weight: bold;
			padding: 2px 10px;
			border-radius: 8px;
			z-index: 3;
			pointer-events: none;
		}
		.deck-code-area{
			display: none;
			font-size: 1rem;
			color: #ffffff;
			background: #222;
			border: 1px solid #555;
			border-radius: 6px;
			padding: 8px 12px;
			/* margin: 20px auto; */
			width: 60%;
			overflow-x: auto;
			position: absolute;
			bottom: 2%;
			left: 20%;
		}
		.deck-section-full-hidden-button {
			background: #333;
			color: #fff;
			border: none;
			border-radius: 6px;
			padding: 8px 24px;
			font-size: 1rem;
			cursor: pointer;
			box-shadow: 0 2px 8px #111;
			transition: background 0.2s;
			/* max-width: 60px; */
			/* max-height: 30px; */
			flex-direction: row;

			position: absolute;
			bottom: 2%;
			right: 1.5%;
		}
		.deck-section-full-hidden-button:hover {
			background: #555;
		}
		.deck-section-full-export-button {
			background: #333;
			color: #fff;
			border: none;
			border-radius: 6px;
			padding: 8px 24px;
			font-size: 1rem;
			cursor: pointer;
			box-shadow: 0 2px 8px #111;
			transition: background 0.2s;
			/* max-width: 60px; */
			/* max-height: 30px; */
			flex-direction: row;

			position: absolute;
			bottom: 2%;
			left: 1.5%;
		}
		.deck-section-full-export-button:hover {
			background: #555;
		}

		.deck-section {
			position: relative;
			flex: 2.5;
			margin: 40px auto;
			padding: 30px;
			background: rgba(30,30,30,0.85);
			border-radius: 18px;
			box-shadow: 0 8px 32px rgba(0,0,0,0.5);

			display: flex;
			flex-direction: column;

			max-height: 85vh;
			max-width: 30vh;

			/* overflow-y: auto; */
			/* align-items: center; */
			/* justify-content: center; */

			/* max-width: 200px;
			background: rgba(30,30,30,0.85);
			border-radius: 18px;
			box-shadow: 0 8px 32px rgba(0,0,0,0.5); */
		}
		.deck-section-show-area{
			position: relative;
			max-height: 70vh;
			overflow-y: auto;
			display: flex;
			flex-direction: column;
		}
		.deck-card-count {
			font-size: 0.8rem;
			color: #aaa;
		}
		.deck-card {
			max-width: 200px;
			max-height: 10px;
			padding: 10px;
			background: rgba(30,30,30,0.85);
			border-radius: 12px;
			box-shadow: 0 4px 16px rgba(0,0,0,0.5);
		}
		
		.deck-card-small-list {
			display: flex;
			padding: 5px;
			gap: 8px;
			flex-direction: column;
		}
		.deck-card-small {
			/* max-width: 180px;
			max-height: 30px;
			padding: 5px;
			background: rgba(30,30,30,0.85);
			border-radius: 12px;
			box-shadow: 0 4px 16px rgba(0,0,0,0.5); */
			display: flex;
			flex-direction: row;
			/* overflow: hidden; */
			align-items: center;
		}
		.deck-card-info {
			display: flex;
			flex-direction: row;
			align-items: center;
			margin-right: 8px;
			width: 350px;
			overflow: hidden;
			white-space: nowrap;
			text-overflow: ellipsis;
		}
		.img-crop-box {	
			width: 300px;
			height: 30px;
			overflow: hidden;
			border-radius: 8px;
			display: flex;
			justify-content: center;
			align-items: center;
			background: #222;

			/* margin-left: 8px; */

			/* width: 150;
			height: auto;
			object-fit: cover;
			object-position: center center; */
		}
		.img-crop-box img {
			width: 150px;
			height: auto;
			object-fit: cover;
			object-position: center 30px;
		}
		.deck-card-small-delete-button {
			background: #333;	
			color: #fff;
			border: none;
			border-radius: 6px;
			padding: 8px 24px;
			font-size: 1rem;
			cursor: pointer;
			box-shadow: 0 2px 8px #111;
			transition: background 0.2s;
			max-width: 10px;
			max-height: 10px;
		}
		.deck-card-small-delete-button:hover {
			background: #555;
		}
		.deck-card-small-scan-button {
			background: #333;
			color: #fff;
			border: none;
			border-radius: 6px;
			padding: 8px 24px;
			font-size: 1rem;
			cursor: pointer;
			box-shadow: 0 2px 8px #111;
			transition: background 0.2s;
			/* max-width: 60px; */
			/* max-height: 30px; */
			flex-direction: row;

			position: absolute;
			bottom: 2%;
			right: 5%;
		}
		.deck-card-small-scan-button:hover {
			background: #555;
		}
		.deck-card-small-import-button {
			background: #333;
			color: #fff;
			border: none;
			border-radius: 6px;
			padding: 8px 24px;
			font-size: 1rem;
			cursor: pointer;
			box-shadow: 0 2px 8px #111;
			transition: background 0.2s;
			/* max-width: 60px; */
			/* max-height: 30px; */
			flex-direction: row;

			position: absolute;
			bottom: 2%;
			left: 5%;
		}

		.search-section {
			flex: 7.5;
			margin: 40px auto;
			padding: 30px;
			background: rgba(30,30,30,0.85);
			border-radius: 18px;
			box-shadow: 0 8px 32px rgba(0,0,0,0.5);

			display: flex;
			flex-direction: column;

			height: 85vh;
		}
		.search-bar {
			display: flex;
			flex-wrap: wrap;
			gap: 12px;
			justify-content: center;
			margin-bottom: 24px;

			max-height: 25vh;
		}
		.search-bar input {
			background: #222;
			color: #ffffff;
			border: 1px solid #555;
			border-radius: 6px;
			padding: 8px 12px;
			font-size: 1rem;
			transition: border-color 0.2s;
		}
		.search-bar input:focus {
			border-color: #aaa;
			outline: none;
		}
		.search-bar button {
			background: #333;
			color: #fff;
			border: none;
			border-radius: 6px;
			padding: 8px 24px;
			font-size: 1rem;
			cursor: pointer;
			box-shadow: 0 2px 8px #111;
			transition: background 0.2s;
		}
		.search-bar button:hover {
			background: #555;
		}
		#result {
			display: flex;
			flex-wrap: wrap;
			gap: 18px;
			flex-direction: row;
			margin-top: 24px;

			max-height: 65vh;
			overflow-y: auto;
		}
		#result img {
			max-width: 250px;
			border-radius: 12px;
			box-shadow: 0 4px 16px #111;
			filter: grayscale(30%);
			transition: transform 0.3s, filter 0.3s;
			cursor: pointer;

			position: relative;
			z-index: 10;
		}
		#result img:hover {
			transform: translateY(-75px) scale(1.5); /* 放大并向上移动 */
			filter: grayscale(0%);
			z-index: 20;
		}
		#result .search-card {
			width: 252px;
			min-height: 320px;
			background: rgba(30,30,30,0.85);
			border-radius: 12px;
			box-shadow: 0 4px 16px rgba(0,0,0,0.5);
			padding: 12px;
			gap: 12px;
			margin: 12px 0;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			flex: none; /* 不自动拉伸 */
		}
		.deck-push-button {
			background: #333;
			color: #fff;
			border: none;
			border-radius: 6px;
			padding: 8px 24px;
			font-size: 1rem;
			cursor: pointer;
			box-shadow: 0 2px 8px #111;
			transition: background 0.2s;
			max-height: 60px;
		}
		.deck-push-button:hover {
			background: #555;
		}
		
		.import-deck-mask {
			display: none;
			position: fixed;
			left: 0;
			top: 0;
			width: 100vw;
			height: 100vh;
			background:rgba(50,50,50,0.5);
			z-index:9999;
		}
		.import-deck-window {
			/* display: none; */
			position: absolute;
			left: 50%;
			top: 50%;
			transform: translate(-50%, -50%);
			background: #222;
			color: #fff;
			padding: 32px;
			border-radius: 12px;
			box-shadow: 0 8px 32px #000;
			min-width: 320px;
		}
	</style>
</head>
<body>
	<div id="import-deck-area">
		<div class="import-deck-mask">
			<h2>导入卡组</h2>
			<div class="import-deck-window">
				<textarea id="import-deck-input" style="width:100%;height:80px;"></textarea>
				<div style="margin-top:16px;">
					<button onclick="doImportDeck()">确定导入</button>
					<button onclick="closeImportDeck()">取消</button>
				</div>
				<div id="import-deck-error" style="color:#f88;margin-top:8px;"></div>
			</div>
		</div>
	</div>
	<div class="main-section">
		<div class="search-section" id="search-section">
			<h2>搜索卡牌</h2>
			<div class="search-bar">
				<input id="searchKeyword" placeholder="搜索卡面标题及内容">
				<input id="searchFeature" placeholder="搜索卡牌特性">
				<input id="searchBelong" placeholder="搜索卡牌所属角色">
				<input id="searchRarity" placeholder="搜索卡牌稀有度">
				<input id="searchManacost" placeholder="搜索灵力消耗">
				<input id="searchPower" placeholder="搜索原始战力">
				<input id="searchSplendor" placeholder="搜索华丽度">
				<input id="searchDamageType" placeholder="搜索伤害类型">
				<input id="searchActivationLevel" placeholder="搜索发动等级需求">
				<input id="tags" placeholder="搜索关联词条（tag）">
				<button onclick="searchCard()">搜索</button>
			</div>
			<div id="result"></div>
		</div>
		<div class="deck-section" id="deck-section">
			<h2>卡组管理</h2>
			<div class="deck-section-show-area" id="deck-area">
				<h3>当前卡组：</h3>
				<!-- 卡组内容将动态生成 -->
			</div>
			<button class="deck-card-small-scan-button" onclick="showFullDeck()">预览卡组</button>
			<button class="deck-card-small-import-button" onclick="showImportDeckWindow()">导入卡组</button>
		</div>
	</div>
	<div class="deck-section-full" id="deck-section-full">
		<h2>卡组预览</h2>
		<div id="full-deck-area"></div>
		<div class="deck-code-area" id="deck-code-area"></div>
		<button class="deck-section-full-export-button" id="copy-deck-code-btn" onclick="copyDeckCode()">复制卡组代码</button>
		<button class="deck-section-full-hidden-button" onclick="hideFullDeck()">结束预览</button>
	</div>

<script>
	let allCards = [];
	let uniqueId2Name = {};
	let deckId2Name = {};
	let deckMap = {};
	let deckCount = 0;
	const MAX_PER_CARD = 3;

	// 页面加载时一次性加载所有卡牌信息
	fetch('allCards_merged.json')
	.then(res => res.json())
	.then(cards => {
		allCards = cards;
		cards.forEach(card => {
			uniqueId2Name[card.unique_card_id] = card.card_id;
			deckId2Name[card.card_id] = card.card_name;
		});
	});

	// 搜索卡牌（本地搜索）
	function searchCard() {
		const keyword = document.getElementById('searchKeyword').value.trim();
		const feature = document.getElementById('searchFeature').value.trim();
		const belong = document.getElementById('searchBelong').value.trim();
		const rarity = document.getElementById('searchRarity').value.trim();
		const manacost = document.getElementById('searchManacost').value.trim();
		const power = document.getElementById('searchPower').value.trim();
		const splendor = document.getElementById('searchSplendor').value.trim();
		const damageType = document.getElementById('searchDamageType').value.trim();
		const activationLevel = document.getElementById('searchActivationLevel').value.trim();
		const tags = document.getElementById('tags').value.trim();

		let result = allCards.filter(card => {
			if (keyword && !(card.card_name?.includes(keyword) || card.card_id?.includes(keyword))) return false;
			if (feature && !(card.card_features?.toString().includes(feature))) return false;
			if (belong && !(card.belongs_to?.toString().includes(belong))) return false;
			if (rarity && card.rarity !== rarity) return false;
			if (manacost && !(card.mana_cost?.toString().includes(manacost))) return false;
			if (power && !(card.base_power?.toString().includes(power))) return false;
			if (splendor && !(card.splendor?.toString().includes(splendor))) return false;
			if (damageType && !(card.damage_type?.toString().includes(damageType))) return false;
			if (activationLevel && !(card.activation_level?.toString().includes(activationLevel))) return false;
			if (tags && !(card.related_tags?.toString().includes(tags))) return false;
			return true;
		});

		let html = '';
		result.forEach(card => {
			html += `
				<div class="search-card">
					<img src="static/Images/${card.card_id}.jpg" alt="卡牌图片">
					<button class="deck-push-button" onclick="addToDeck('${card.card_id}', '${card.card_name}', ${card.unique_card_id})">加入卡组</button>
				</div>
			`;
		});
		document.getElementById('result').innerHTML = html;
	}

	// 卡组管理相关
	function make_card_list() {
		let html = '<div class="deck-section-full-card-list">';
		const Map = deckMap;
		const sortedIds = Object.keys(Map).sort();
		for (const id of sortedIds) {
			html += `
					<div class="deck-section-full-card">
						<img src="static/Images/${id}.jpg" alt=${id}>
						<span class="card-count-overlay"> ${deckMap[id].count} </span>
					</div>
			`;
		}
		html += '</div>';
		document.getElementById('full-deck-area').innerHTML = html;
	}
	function addToDeck(cardId, card_name, unique_card_id) {
		if(deckMap[cardId] && deckMap[cardId].count >= MAX_PER_CARD) {
			alert(`卡牌 ${cardId} 已达到上限！`);
			return;
		}
		else if(cardId.includes("-C") && deckMap[cardId] && deckMap[cardId].count >= 1) {
			alert(`卡牌 ${cardId} 已存在于卡组中！`);
			return;
		}
		if(!deckMap[cardId]){
			deckMap[cardId] = { count: 1, unique_card_id: unique_card_id }
		}
		else{
			deckMap[cardId].count ++;
		}
		if(!cardId.includes("-C"))
			deckCount++;
		showDeck();
	}
	function deleteFromDeck(cardId) {
		if(deckMap[cardId]) {
			deckMap[cardId].count--;
			if(deckMap[cardId].count <= 0) {
				delete deckMap[cardId];
			}
			if(!cardId.includes("-C"))
				deckCount--;
		} else {
			alert(`卡牌 ${cardId} 不在卡组中！`);
		}
		showDeck();
	}
	function showDeck() {
		let html = `<h3>当前卡组：${deckCount} / 60</h3>`;
		html += `<div class="deck-card-small-list">`;
		const sortedIds = Object.keys(deckMap).sort();
		for (const id of sortedIds) {
			html += `
					<div class="deck-card-small">
						<button class="deck-card-delete-button" onclick="deleteFromDeck('${id}')">×</button>
						<div class="deck-card-info">
							<span style="color:#fff;font-size:12px; margin-right:8px;">${deckMap[id].count} 张 ${id}</span>
							<span style="color:#aaa;font-size:12px;">${deckId2Name[id]}</span>
						</div>
						<div class="img-crop-box">
							<img src="static/Images/${id}.jpg" alt="${id}">
						</div>
					</div>
			`;
		}
		html += `</div>`;
		document.getElementById('deck-area').innerHTML = html;
	}

	// 界面切换
	const search_section=document.getElementById('search-section');
	const deck_section=document.getElementById('deck-section');
	const deck_section_full=document.getElementById('deck-section-full');
	const deck_code_area=document.getElementById('deck-code-area');
	function showFullDeck() {
		search_section.style.display = 'none';
		deck_section.style.display = 'none';
		deck_section_full.style.display = 'flex';
		make_card_list()
	}
	function hideFullDeck() {
		search_section.style.display = 'flex';
		deck_section.style.display = 'flex';
		deck_section_full.style.display = 'none';
		deck_code_area.style.display = 'none';
	}

	// 卡组代码生成
	function showDeckCode() {
		let cards = [];
		for (const id in deckMap) {
			cards.push({
				id: id,
				count: deckMap[id].count,
				unique_card_id: deckMap[id].unique_card_id
			});
		}
		let roleCards = cards.filter(c => c.id.includes('-C'));
		let oneCards = cards.filter(c => c.count === 1 && !c.id.includes('-C'));
		let twoCards = cards.filter(c => c.count === 2 && !c.id.includes('-C'));
		let threeCards = cards.filter(c => c.count === 3 && !c.id.includes('-C'));

		let sequence = [];
		sequence.push(roleCards.length);
		roleCards.sort((a, b) => a.unique_card_id - b.unique_card_id).forEach(c => sequence.push(c.unique_card_id));
		if (oneCards.length > 0) {
			sequence.push(1);
			oneCards.sort((a, b) => a.unique_card_id - b.unique_card_id).forEach(c => sequence.push(c.unique_card_id));
		}
		if (twoCards.length > 0) {
			sequence.push(2);
			twoCards.sort((a, b) => a.unique_card_id - b.unique_card_id).forEach(c => sequence.push(c.unique_card_id));
		}
		if (threeCards.length > 0) {
			sequence.push(3);
			threeCards.sort((a, b) => a.unique_card_id - b.unique_card_id).forEach(c => sequence.push(c.unique_card_id));
		}

		function encodeVarint(num) {
			let bytes = [];
			while (num > 127) {
				bytes.push((num & 0x7F) | 0x80);
				num >>>= 7;
			}
			bytes.push(num);
			return bytes;
		}
		let byteArr = [];
		sequence.forEach(n => byteArr.push(...encodeVarint(n)));

		function bytesToBase64(bytes) {
			let bin = '';
			bytes.forEach(b => bin += String.fromCharCode(b));
			return btoa(bin);
		}
		let deckCode = bytesToBase64(byteArr);

		document.getElementById('deck-code-area').textContent = deckCode;
		deck_code_area.style.display = 'block';
	}

	function copyDeckCode() {
		showDeckCode();
		const code = document.getElementById('deck-code-area').textContent;
		navigator.clipboard.writeText(code).then(() => {
			document.getElementById('copy-deck-code-btn').textContent = '已复制！';
			setTimeout(() => {
				document.getElementById('copy-deck-code-btn').textContent = '复制卡组代码';
			}, 1200);
		});
	}

	// 卡组导入
	const import_deck_mask = document.querySelector('.import-deck-mask');
	const import_deck_window = document.querySelector('.import-deck-window');
	function showImportDeckWindow() {
		import_deck_mask.style.display = 'block';
		import_deck_window.style.display = 'block';
		document.getElementById('import-deck-error').textContent = '';
	}
	function closeImportDeck() {
		import_deck_mask.style.display = 'none';
		import_deck_window.style.display = 'none';
		document.getElementById('import-deck-input').value = '';
	}
	function doImportDeck() {
		const code = document.getElementById('import-deck-input').value.trim();
		if (!code) {
			document.getElementById('import-deck-error').textContent = '请输入卡组代码！';
			return;
		}
		try {
			function base64ToBytes(str) {
				const bin = atob(str);
				return Array.from(bin).map(c => c.charCodeAt(0));
			}
			function decodeVarint(bytes) {
				let arr = [];
				let i = 0;
				while (i < bytes.length) {
					let num = 0, shift = 0;
					while (true) {
						let b = bytes[i++];
						num |= (b & 0x7F) << shift;
						if ((b & 0x80) === 0) break;
						shift += 7;
					}
					arr.push(num);
				}
				return arr;
			}
			const bytes = base64ToBytes(code);
			const arr = decodeVarint(bytes);
			let idx = 0;
			let newDeck = {};
			if (arr.length === 0) throw new Error('卡组代码为空');
			let roleCount = arr[idx++];
			for (let i = 0; i < roleCount; i++) {
				if (idx >= arr.length) throw new Error('角色卡数量与数据不符');
				let unique_card_id = arr[idx++];
				let cardId = findCardIdByUnique(unique_card_id);
				if (cardId) newDeck[cardId] = { count: 1, unique_card_id: unique_card_id };
			}
			while (idx < arr.length) {
				let countType = arr[idx++];
				while (idx < arr.length && arr[idx] !== 1 && arr[idx] !== 2 && arr[idx] !== 3) {
					let unique_card_id = arr[idx++];
					let cardId = findCardIdByUnique(unique_card_id);
					if (cardId) newDeck[cardId] = { count: countType, unique_card_id: unique_card_id };
				}
			}
			deckMap = newDeck;
			deckCount = 0;
			for (const id in deckMap) {
				if (!id.includes('-C')) deckCount += deckMap[id].count;
			}
			closeImportDeck();
			showDeck();
		} catch(e) {
			document.getElementById('import-deck-error').textContent = '卡组代码格式错误！';
		}
	}
	function findCardIdByUnique(unique_card_id) {
		return uniqueId2Name[unique_card_id] || null;
	}
</script>
