<head>
	<meta charset="UTF-8">
	<title>卡牌管理前端示例</title>
	<style>
		body {
			background: linear-gradient(120deg, #222 0%, #444 100%);
			color: #eee;
			font-family: 'Segoe UI', 'Microsoft YaHei', Arial, sans-serif;
			margin: 0;
			padding: 0;
		}
		h2 {
			text-align: center;
			font-size: 2rem;
			margin-bottom: 24px;
			color: #fff;
			letter-spacing: 2px;
			text-shadow: 0 2px 8px #000;
		}
		.main-section {
			display: flex;
			gap: 24px;
			max-width: 1400px;
			margin: 0 auto;
		}
		.deck-section-full {
			/* flex: 10; */
			width: 75%;
			margin: 40px auto;
			padding: 30px 0;
			background: rgba(30,30,30,0.85);
			border-radius: 18px;
			box-shadow: 0 8px 32px rgba(0,0,0,0.5);

			display: none;
			flex-direction: column;

			height: 85vh;
			/* max-height: 85vh; */
			overflow-y: auto;
		}
		.deck-section-full-card-list {
			display: flex;
			padding: 5px 2.5%;
			gap: 1%;
			flex-direction: row;
			flex-wrap: wrap;
		}
		.deck-section-full-card{
			position: relative;

			flex: 0 1 calc((100% - 5%) / 6);
			min-width: 150px;
			height: auto;
			/* max-width: 18%; */
			margin: 0;
			padding: 0;
			background: rgba(40,40,40,0.85);
			border-radius: 12px;
			box-shadow: 0 4px 16px rgba(0,0,0,0.5);
			display: flex;
			flex-direction: column;
			align-items: center;
		}
		.deck-section-full-card img {
			width: 100%;
			height: 100%;
			border-radius: 12px;
			box-shadow: 0 4px 16px #111;
			filter: grayscale(30%);
			transition: transform 0.3s, filter 0.3s;
			cursor: pointer;
			object-fit: cover;
			display: block;
		}
		.card-count-overlay {
			position: absolute;
			top: 8px;
			left: 12px;
			background: rgba(0,0,0,0.6);
			color: #fff;
			font-size: 1.4rem;
			font-weight: bold;
			padding: 2px 10px;
			border-radius: 8px;
			z-index: 3;
			pointer-events: none;
		}
		.deck-section-full-hidden-button {
			background: #333;
			color: #fff;
			border: none;
			border-radius: 6px;
			padding: 8px 24px;
			font-size: 1rem;
			cursor: pointer;
			box-shadow: 0 2px 8px #111;
			transition: background 0.2s;
			/* max-width: 60px; */
			/* max-height: 30px; */
			flex-direction: row;

			position: fixed;
			bottom: 15%;
			right: 5%;
		}
		.deck-section-full-hidden-button:hover {
			background: #555;
		}

		.deck-section {
			flex: 2.5;
			margin: 40px auto;
			padding: 30px;
			background: rgba(30,30,30,0.85);
			border-radius: 18px;
			box-shadow: 0 8px 32px rgba(0,0,0,0.5);

			display: flex;
			flex-direction: column;

			max-height: 100vh;
			max-width: 30vh;
			/* align-items: center; */
			/* justify-content: center; */

			/* max-width: 200px;
			background: rgba(30,30,30,0.85);
			border-radius: 18px;
			box-shadow: 0 8px 32px rgba(0,0,0,0.5); */
		}
		.deck-card-count {
			font-size: 0.8rem;
			color: #aaa;
		}
		.deck-card {
			max-width: 200px;
			max-height: 10px;
			padding: 10px;
			background: rgba(30,30,30,0.85);
			border-radius: 12px;
			box-shadow: 0 4px 16px rgba(0,0,0,0.5);
		}
		
		.deck-card-small-list {
			display: flex;
			padding: 5px;
			gap: 8px;
			flex-direction: column;
		}
		.deck-card-small {
			/* max-width: 180px;
			max-height: 30px;
			padding: 5px;
			background: rgba(30,30,30,0.85);
			border-radius: 12px;
			box-shadow: 0 4px 16px rgba(0,0,0,0.5); */
			display: flex;
			flex-direction: row;
			/* overflow: hidden; */
			align-items: center;
		}
		.deck-card-info {
			display: flex;
			flex-direction: row;
			align-items: center;
			margin-right: 8px;
			width: 350px;
			overflow: hidden;
			white-space: nowrap;
			text-overflow: ellipsis;
		}
		.img-crop-box {	
			width: 300px;
			height: 30px;
			overflow: hidden;
			border-radius: 8px;
			display: flex;
			justify-content: center;
			align-items: center;
			background: #222;

			/* margin-left: 8px; */

			/* width: 150;
			height: auto;
			object-fit: cover;
			object-position: center center; */
		}
		.img-crop-box img {
			width: 150px;
			height: auto;
			object-fit: cover;
			object-position: center 30px;
		}
		.deck-card-small-delete-button {
			background: #333;	
			color: #fff;
			border: none;
			border-radius: 6px;
			padding: 8px 24px;
			font-size: 1rem;
			cursor: pointer;
			box-shadow: 0 2px 8px #111;
			transition: background 0.2s;
			max-width: 10px;
			max-height: 10px;
		}
		.deck-card-small-delete-button:hover {
			background: #555;
		}
		.deck-card-small-scan-button {
			background: #333;
			color: #fff;
			border: none;
			border-radius: 6px;
			padding: 8px 24px;
			font-size: 1rem;
			cursor: pointer;
			box-shadow: 0 2px 8px #111;
			transition: background 0.2s;
			/* max-width: 60px; */
			/* max-height: 30px; */
			flex-direction: row;

			position: fixed;
			bottom: 15%;
			right: 5%;
		}
		.deck-card-small-scan-button:hover {
			background: #555;
		}
		.deck-push-button {
			background: #333;
			color: #fff;
			border: none;
			border-radius: 6px;
			padding: 8px 24px;
			font-size: 1rem;
			cursor: pointer;
			box-shadow: 0 2px 8px #111;
			transition: background 0.2s;
			max-height: 60px;
		}
		.deck-push-button:hover {
			background: #555;
		}

		.search-section {
			flex: 7.5;
			margin: 40px auto;
			padding: 30px;
			background: rgba(30,30,30,0.85);
			border-radius: 18px;
			box-shadow: 0 8px 32px rgba(0,0,0,0.5);

			display: flex;
			flex-direction: column;

			height: 85vh;
		}
		.search-bar {
			display: flex;
			flex-wrap: wrap;
			gap: 12px;
			justify-content: center;
			margin-bottom: 24px;

			max-height: 25vh;
		}
		.search-bar input {
			background: #222;
			color: #ffffff;
			border: 1px solid #555;
			border-radius: 6px;
			padding: 8px 12px;
			font-size: 1rem;
			transition: border-color 0.2s;
		}
		.search-bar input:focus {
			border-color: #aaa;
			outline: none;
		}
		.search-bar button {
			background: #333;
			color: #fff;
			border: none;
			border-radius: 6px;
			padding: 8px 24px;
			font-size: 1rem;
			cursor: pointer;
			box-shadow: 0 2px 8px #111;
			transition: background 0.2s;
		}
		.search-bar button:hover {
			background: #555;
		}
		#result {
			display: flex;
			flex-wrap: wrap;
			gap: 18px;
			flex-direction: row;
			margin-top: 24px;

			max-height: 65vh;
			overflow-y: auto;
		}
		#result img {
			max-width: 250px;
			border-radius: 12px;
			box-shadow: 0 4px 16px #111;
			filter: grayscale(30%);
			transition: transform 0.3s, filter 0.3s;
			cursor: pointer;
		}
		#result img:hover {
			transform: translateY(-75px) scale(1.5); /* 放大并向上移动 */
			filter: grayscale(0%);
			z-index: 2;
		}
		#result .search-card {
			width: 252px;
			min-height: 320px;
			background: rgba(30,30,30,0.85);
			border-radius: 12px;
			box-shadow: 0 4px 16px rgba(0,0,0,0.5);
			padding: 12px;
			gap: 12px;
			margin: 12px 0;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			flex: none; /* 不自动拉伸 */
		}
	</style>
</head>
<body>
	<div class="main-section">
		<div class="search-section" id="search_section">
			<h2>搜索卡牌</h2>
			<div class="search-bar">
				<input id="searchKeyword" placeholder="搜索卡面标题及内容">
				<input id="searchFeature" placeholder="搜索卡牌特性">
				<input id="searchBelong" placeholder="搜索卡牌所属角色">
				<input id="searchRarity" placeholder="搜索卡牌稀有度">
				<input id="searchManacost" placeholder="搜索灵力消耗">
				<input id="searchPower" placeholder="搜索原始战力">
				<input id="searchSplendor" placeholder="搜索华丽度">
				<input id="searchDamageType" placeholder="搜索伤害类型">
				<input id="searchActivationLevel" placeholder="搜索发动等级需求">
				<input id="tags" placeholder="搜索关联词条（tag）">
				<button onclick="searchCard()">搜索</button>
			</div>
			<div id="result"></div>
		</div>
		<div class="deck-section" id="deck_section">
			<h2>卡组管理</h2>
			<div id="deck_area">
				<h3>当前卡组：</h3>
				<!-- 卡组内容将动态生成 -->
			</div>
			<button class="deck-card-small-scan-button" onclick="showFullDeck()">预览卡组</button>
		</div>
	</div>
	<div class="deck-section-full" id="deck_section_full">
		<h2>卡组预览</h2>
		<div id="full_deck_area"></div>
		<button class="deck-section-full-hidden-button" onclick="hideFullDeck()">结束预览</button>
	</div>
	<script>	// 搜索卡牌
	function searchCard() {
		const keyword = document.getElementById('searchKeyword').value;
		const feature = document.getElementById('searchFeature').value;
		const belong = document.getElementById('searchBelong').value;
		const rarity = document.getElementById('searchRarity').value;
		const manacost = document.getElementById('searchManacost').value;
		const power = document.getElementById('searchPower').value;
		const splendor = document.getElementById('searchSplendor').value;
		const damageType = document.getElementById('searchDamageType').value;
		const activationLevel = document.getElementById('searchActivationLevel').value;
		const tags = document.getElementById('tags').value;
		let queryParams = `?keyword=${encodeURIComponent(keyword)}`;
		if (feature) queryParams += `&feature=${encodeURIComponent(feature)}`;
		if (belong) queryParams += `&belong=${encodeURIComponent(belong)}`;
		if (rarity) queryParams += `&rarity=${encodeURIComponent(rarity)}`;
		if (manacost) queryParams += `&manacost=${encodeURIComponent(manacost)}`;
		if (power) queryParams += `&power=${encodeURIComponent(power)}`;
		if (splendor) queryParams += `&splendor=${encodeURIComponent(splendor)}`;
		if (damageType) queryParams += `&damageType=${encodeURIComponent(damageType)}`;
		if (activationLevel) queryParams += `&activationLevel=${encodeURIComponent(activationLevel)}`;
		if (tags) queryParams += `&tags=${encodeURIComponent(tags)}`;
		fetch(`http://127.0.0.1:5000/card/search${queryParams}`)
			.then(res => res.json())
			.then(data => {
				let html = '';
				data.forEach(card => {
					html += `
						<div class="search-card">
						<img src="http://127.0.0.1:5000/static/Images/${card.card_id}.jpg" alt="卡牌图片">
						<button class="deck-push-button" onclick="addToDeck('${card.card_id}', '${card.card_name}')">加入卡组</button>
						</div>
					`
					// html += `<img src="http://127.0.0.1:5000/static/Images/${card.card_id}.jpg" alt="卡牌图片">`;
					// html += `<button class="deck-push-button" onclick="addToDeck(${card.card_id})">加入卡组</button>`;
				});
				html += '</div>';
				document.getElementById('result').innerHTML = html;
			});
	}
	</script>
	<script>	// 卡组管理
		let deckMap = {};
		let deckId2Name = {};
		let deckCount = 0;
		const MAX_PER_CARD = 3;

		function make_card_list() {
			// alert(`${deckMap}`);
			let html = '<div class="deck-section-full-card-list">';
			const Map = deckMap;
			const sortedIds = Object.keys(Map).sort();
			// alert(`${deckCount}`);
			for (const id of sortedIds) {
				html += `
						<div class="deck-section-full-card">
							<img src="http://127.0.0.1:5000/static/Images/${id}.jpg" alt=${id}>
							<span class="card-count-overlay"> ${deckMap[id]} </span>
						</div>
				`;
				// alert("test");
			}
			// alert("fin");
			html += '</div>';
			document.getElementById('full_deck_area').innerHTML = html;
		}
		function addToDeck(cardId, card_name) {
			if(deckMap[cardId] && deckMap[cardId] >= MAX_PER_CARD) {
				alert(`卡牌 ${cardId} 已达到上限！`);
				return;
			}
			else if(cardId.includes("-C") && deckMap[cardId] && deckMap[cardId] >= 1) {
				alert(`卡牌 ${cardId} 已存在于卡组中！`);
				return;
			}
			deckMap[cardId] = (deckMap[cardId] || 0) + 1;
			deckId2Name[cardId] = card_name;
			if(!cardId.includes("-C"))
				deckCount++;
			// alert(`卡牌 ${cardId} 已加入卡组！`);
			showDeck();
		}
		function deleteFromDeck(cardId) {
			if(deckMap[cardId]) {
				deckMap[cardId]--;
				if(deckMap[cardId] <= 0) {
					delete deckMap[cardId];
				}
				// alert(`卡牌 ${cardId} 已从卡组中移除！`);
				if(!cardId.includes("-C"))
				deckCount--;
			} else {
				alert(`卡牌 ${cardId} 不在卡组中！`);
			}
			showDeck();
		}
		function showDeck() {
			let html = `<h3>当前卡组：${deckCount} / 60</h3>`;
			html += `<div class="deck-card-small-list">`;
			const sortedIds = Object.keys(deckMap).sort();
			for (const id of sortedIds) {
				// alert("test");g
				// html += `<span style="margin:6px;padding:4px 10px;
				// 		background:#444;
				// 		color:#fff;
				// 		border-radius:8px;">
				//		 ${id} × ${deckMap[id]}
				//	 </span>`;
				html += `
						<div class="deck-card-small">
							<button class="deck-card-delete-button" onclick="deleteFromDeck('${id}')">×</button>
							<div class="deck-card-info">
								<span style="color:#fff;font-size:12px; margin-right:8px;">${deckMap[id]} 张 ${id}</span>
								<span style="color:#aaa;font-size:12px;">${deckId2Name[id]}</span>
							</div>
							<!-- <span style="color:#fff;font-size:12px; margin-right:8px;">${deckMap[id]} 张 ${id} ${deckId2Name[id]}</span> -->
							<div class="img-crop-box">
							<img src="http://127.0.0.1:5000/static/Images/${id}.jpg" alt="${id}">
							</div>
						</div>
`;
			}
			html += `</div>`;
			document.getElementById('deck_area').innerHTML = html;
		}
	</script>
	<script>	// 界面切换
		const search_section=document.getElementById('search_section');
		const deck_section=document.getElementById('deck_section');
		const deck_section_full=document.getElementById('deck_section_full');
		function showFullDeck() {
			search_section.style.display = 'none';
			deck_section.style.display = 'none';
			deck_section_full.style.display = 'flex';
			make_card_list()
		}
		function hideFullDeck() {
			search_section.style.display = 'flex';
			deck_section.style.display = 'flex';
			deck_section_full.style.display = 'none';
		}
	</script>
</body>
