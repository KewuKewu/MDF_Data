<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <title>卡牌管理前端示例</title>
</head>
<body>
    <!-- <h2>添加卡牌</h2> -->
    <!-- 点击按钮会调用 addCard() 方法，向后端添加一张示例卡牌 -->
    <!-- <button onclick="addCard()">添加示例卡牌</button> -->
    <h2>搜索卡牌</h2>
    <!-- 输入框用于输入搜索关键字 -->
    <input id="searchKeyword" placeholder="搜索卡面标题及内容">
    <input id="searchFeature" placeholder="搜索卡牌特性">
    <input id="searchBelong" placeholder="搜索卡牌所属角色">
    <input id="searchRarity" placeholder="搜索卡牌稀有度">
    <input id="searchManacost" placeholder="搜索灵力消耗">
    <input id="searchPower" placeholder="搜索原始战力">
    <input id="searchSplendor" placeholder="搜索华丽度">
    <input id="searchDamageType" placeholder="搜索伤害类型">
    <input id="searchActivationLevel" placeholder="搜索发动等级需求">
    <input id="tags" placeholder="搜索关联词条（tag）">
    <!-- 点击按钮会调用 searchCard() 方法，向后端发起搜索请求 -->
    <button onclick="searchCard()">搜索</button>
    <!-- <h2>删除卡牌</h2> -->
    <!-- <input id="deleteCardId" placeholder="卡牌ID"> -->
    <!-- 点击按钮会调用 deleteCard() 方法，向后端删除指定ID的卡牌 -->
    <!-- <button onclick="deleteCard()">删除卡牌</button> -->
    <!-- 显示搜索结果 -->
    <div id="result"></div>

    <script>
    // 搜索卡牌
    // 调用后端 /card/search 接口，GET 请求，带关键字参数
    function searchCard() {
        const keyword = document.getElementById('searchKeyword').value;
        const feature = document.getElementById('searchFeature').value;
        const belong = document.getElementById('searchBelong').value;
        const rarity = document.getElementById('searchRarity').value;
        const manacost = document.getElementById('searchManacost').value;
        const power = document.getElementById('searchPower').value;
        const splendor = document.getElementById('searchSplendor').value;
        const damageType = document.getElementById('searchDamageType').value;
        const activationLevel = document.getElementById('searchActivationLevel').value;
        const tags = document.getElementById('tags').value;
        // 拼接查询参数
        let queryParams = `?keyword=${encodeURIComponent(keyword)}`;
        if (feature) queryParams += `&feature=${encodeURIComponent(feature)}`;
        if (belong) queryParams += `&belong=${encodeURIComponent(belong)}`;
        if (rarity) queryParams += `&rarity=${encodeURIComponent(rarity)}`;
        if (manacost) queryParams += `&manacost=${encodeURIComponent(manacost)}`;
        if (power) queryParams += `&power=${encodeURIComponent(power)}`;
        if (splendor) queryParams += `&splendor=${encodeURIComponent(splendor)}`;
        if (damageType) queryParams += `&damageType=${encodeURIComponent(damageType)}`;
        if (activationLevel) queryParams += `&activationLevel=${encodeURIComponent(activationLevel)}`;
        if (tags) queryParams += `&tags=${encodeURIComponent(tags)}`;
        fetch(`http://127.0.0.1:5000/card/search${queryParams}`)
            .then(res => res.json())
            // 只显示卡牌图片
            .then(data => {
                // 假设每个卡牌对象有 image_path 字段
                let html = '';
                data.forEach(card => {
                    // 拼接图片完整路径
                    html += `<img src="http://127.0.0.1:5000/static/Images/${card.card_id}.jpg" alt="卡牌图片" style="max-width:300px;margin:10px;">`;
                });
                document.getElementById('result').innerHTML = html;
            });
    }
</script>
</body>
